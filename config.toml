# Academic coverage: papers from arXiv (official API) plus news/LinkedIn about
# studies. An item counts as academic if its text or URL contains one of `terms`.
[academic]
terms = ["university", "professor", "business school", "arxiv", "ssrn", "working paper", "journal",
         "peer-review", "pew research", "phd", "institute of technology", "researchers at", "academic",
         "nber", ".edu"]
# arXiv API search syntax (abs: = abstract, ti: = title)
arxiv_queries = [
  'abs:"synthetic respondents"',
  'abs:"silicon sampling"',
  'abs:"silicon samples"',
  'abs:"synthetic personas"',
  'abs:"synthetic survey"',
  'abs:"homo silicus"',
  'abs:"digital twins" AND (abs:"survey respondents" OR abs:"consumers" OR abs:"public opinion")',
  'abs:"large language models" AND abs:"survey responses" AND abs:"simulat"',
  'abs:"LLM" AND abs:"market research"',
  'abs:"LLM" AND abs:"public opinion" AND abs:"simulat"',
]
# arXiv papers must mention one of these to be kept.
relevance_terms = ["respondent", "survey respon", "survey data", "public opinion", "poll", "market research",
                   "consumer", "persona", "silicon sampl", "silicon subject", "homo silicus", "synthetic sample",
                   "synthetic survey", "synthetic panel", "questionnaire", "social science", "simulated human",
                   "human participants", "focus group"]
# Name-free searches that surface studies and commentators not on any list.
discovery_queries = [
  '"synthetic respondents" (study OR professor OR researchers OR paper)',
  '"silicon sampling" OR "homo silicus"',
  '"digital twins" (survey OR consumers) (study OR professor OR researchers)',
  '"synthetic data" "market research" (opinion OR column OR interview)',
]

# ---- Classification rules --------------------------------------------------
# Signal types: what kind of move is this item evidence of?
[signals]
"Leadership change"    = ["appoint", " ceo", "chief executive", "steps down", "transition", "names new", "hires"]
"Product launch"       = ["launch", "introduc", "unveil", "now available", "new product", "release", "beta", "debut", "rolls out", "rolled out"]
"Partnership / M&A"    = ["partner", "acqui", "merger", "integration with", "collaborat", "teams up", "alliance", "joins forces"]
"Funding"              = ["raise", "funding", "series a", "series b", "seed round", "investor", " valuation"]
"Validation claim"     = ["accura", "validat", "correlat", "match rate", "benchmark", "% of", "parity", "replicat"]
"Hiring"               = ["hiring", "we're looking for", "join our team", "job opening", "open role"]
"Pricing / packaging"  = ["pricing", "per respondent", "cost", "cheaper", "subscription", "free trial"]
"Events / thought leadership" = ["webinar", "keynote", "panel", "conference", "esomar", "iiex", "quirks", "mrs ", "whitepaper", "report"]
"Skepticism / risk"    = ["hallucinat", "bias", "risk", "concern", "can't replace", "cannot replace", "skeptic", "caution", "limitation"]

# Capability tags: what part of the synthetic offering is being discussed?
[capabilities]
"Synthetic respondents / sample" = ["synthetic respondent", "synthetic sample", "synthetic panel", "silicon sampl", "ai respondent"]
"Digital twins"                  = ["digital twin"]
"Personas"                       = ["persona", "virtual audience"]
"Sample boosting / augmentation" = ["boost", "augment", "imput", "low-incidence", "hard-to-reach", "fill quota"]
"Concept / ad testing"           = ["concept test", "ad test", "creative test", "pre-test", "screener"]
"AI-moderated qual"              = ["ai moderat", "ai interview", "conversational", "qual at scale"]
"Data privacy / synthetic data"  = ["privacy", "gdpr", "anonymi", "synthetic data"]
