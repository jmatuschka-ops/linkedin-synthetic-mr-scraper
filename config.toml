# LinkedIn scraper (synthetic offerings in market research) — configuration
# Edit competitors, aliases, and topic terms freely. Aliases are matched
# case-insensitively against titles/snippets to attribute items. A competitor's
# optional `exclude` list drops matches that contain any of those words.

[settings]
db_path = "data/linkedin_scraper.db"
report_path = "reports/linkedin_synthetic_mr.html"
hosted_report_path = "reports/linkedin_synthetic_mr_hosted.html"   # skeleton-free copy for the hosted link
csv_path = "reports/linkedin_synthetic_mr.csv"
request_delay_seconds = 1.5     # politeness delay between search calls
max_results_per_query = 20      # per page (Brave max 20, SerpAPI 10)
max_pages = 3                   # pages fetched per LinkedIn query while more results exist
# How far back collection reaches. Keep it >= 2x the longest report period so
# the report can compare each period with the one before it.
lookback_days = 180
# Period switcher in the report (days) and which one opens by default.
report_periods = [7, 14, 30, 60, 90]
default_period = 30
# Which sources a run uses. LinkedIn comes from tavily (or brave/serpapi if keyed); news and arxiv
# add industry and academic context. For a LinkedIn-only report: sources = ["tavily", "inbox"]
sources = ["news", "tavily", "brave", "serpapi", "arxiv", "inbox"]

# Tavily LinkedIn search (free tier: 1,000 credits/month; a weekly run uses up to credits_per_run)
[tavily]
# Tavily only ever searches linkedin.com. News (Google News) and papers (arXiv) are separate free sources.
search_depth = "advanced"       # main searches: finds more posts and returns fuller text; 2 credits each
variant_depth = "basic"         # extra phrasings for searches that fill the 20-result limit; 1 credit each
max_results = 20
include_domains = ["linkedin.com"]
# Free tier: 1,000 credits/month. The script stops before either cap; main searches go first.
credits_per_run = 190
credits_per_month = 950
date_check_credits = 20         # of each run's credits, kept for looking up Pulse article publish dates
# A search that returns the full 20 results is re-run with each of these appended, to reach
# posts beyond the first 20 (Tavily has no next page). Each costs one search.
capped_variants = ["launch announcement", "study results accuracy"]   # used in order while credits allow

# Search terms that define the "synthetic" space.
[topics]
# Specific to research: searched as-is.
specific = [
  "synthetic respondents",
  "synthetic sample",
  "synthetic personas",
  "synthetic panel",
  "synthetic consumers",
  "silicon sampling",
  "AI-generated respondents",
  "digital twin respondents",
  "synthetic research",
  "simulated respondents",
  "simulated audience",
  "synthetic focus group",
  "agentic twins",
  "AI-simulated consumers",
]
# Broad terms: searched together with a research-context qualifier
# (otherwise manufacturing / healthcare "digital twin" coverage swamps results).
generic = [
  "synthetic data",
  "digital twins",
  "AI personas",
  "virtual audiences",
]
qualifier = '("market research" OR "consumer research" OR insights OR survey OR respondents)'

# Items that don't name a tracked competitor must contain one of these to be
# kept (filters out e.g. manufacturing "digital twin" coverage).
[relevance]
context_terms = ["market research", "consumer research", "insights", "survey", "respondent",
                 "panel", "researcher", "esomar", "quirks", "research live", "brand tracking",
                 "concept test", "consumer"]
# Items containing any of these are always dropped (syndicated market-sizing PRs etc.).
exclude_terms = ["market size", "market share", "cagr", "industry report", "augmented reality",
                 "market to reach", "forecast period", "future outlook", "market outlook", "market report",
                 "market analysis", "market forecast",
                 # non-research "digital twin" industries
                 " road ", " roads", "mobility sector", "manufactur", "factory", "patient", "supply chain",
                 "smart city", "aerospace", "oil and gas", "power grid", "construction", "farming",
                 "agricultur", "mining", "mineral"]

# ---- Qualtrics (for comparison) ---------------------------------------------
# Shown alongside competitors. require_topic: only items that are actually about synthetic
# research count, since most Qualtrics coverage isn't. Add Qualtrics product names as aliases.
[[competitors]]
name = "Qualtrics"
aliases = ["Qualtrics"]
segment = "self"
require_topic = true

